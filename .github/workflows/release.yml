name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && format('Release {0} ({1})', inputs.tag, inputs.expected_tag_object) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (vX.Y.Z)
        required: true
        type: string
      expected_tag_object:
        description: Approved tag object SHA. Leave blank when running from main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare and dispatch the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ inputs.expected_tag_object }}
        run: python scripts/release_gate.py --prepare

  version:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tag_object: ${{ steps.gate.outputs.tag_object }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the annotated release tag and main CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ inputs.expected_tag_object }}
        run: python scripts/release_gate.py

  build:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [version, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Verify and include the corresponding Qt source
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import shutil
          import urllib.parse
          import urllib.request
          from pathlib import Path

          assets = Path("release-assets")
          packages = sorted(assets.iterdir())
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          expected_packages = {
              f"QCopilots-WebSearch-{version}-win-amd64.zip",
              f"QCopilots-WebSearch-{version}-win-amd64.msi",
              f"QCopilots-WebSearch-{version}-linux-amd64.deb",
          }
          if any(not item.is_file() for item in packages) or {item.name for item in packages} != expected_packages:
              raise RuntimeError(f"Expected the Windows ZIP, MSI and Ubuntu DEB for {version}")
          source = json.loads(Path("config/dependencies.lock.json").read_text())["qt_source"]
          expected = source["sha256"]
          url = urllib.parse.urlsplit(source["url"])
          name = url.path.rsplit("/", 1)[-1]
          if url.scheme != "https" or not re.fullmatch(r"qtbase-everywhere-src-[0-9.]+\.tar\.xz", name):
              raise RuntimeError("Invalid Qt source lock")
          archive = assets / name
          with urllib.request.urlopen(source["url"], timeout=120) as response, archive.open("xb") as stream:
              if urllib.parse.urlsplit(response.geturl()).scheme != "https":
                  raise RuntimeError("Qt source redirected away from HTTPS")
              shutil.copyfileobj(response, stream)

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          if digest(archive) != expected:
              raise RuntimeError("Qt source hash differs from the lock")
          entries = sorted([*packages, archive])
          (assets / "SHA256SUMS").write_text("".join(f"{digest(path)}  {path.name}\n" for path in entries), encoding="ascii")
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.msi
            release-assets/*.deb
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTED_TAG_OBJECT: ${{ needs.version.outputs.tag_object }}
        run: |
          local_tag=$(git rev-parse --verify "$GITHUB_REF")
          verify_release_tag() {
            remote_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
            if [[ "$local_tag" != "$ACCEPTED_TAG_OBJECT" || "$remote_tag" != "$ACCEPTED_TAG_OBJECT" ]]; then
              echo "The annotated release tag changed after validation." >&2
              exit 1
            fi
          }
          python scripts/release_gate.py --check-release
          verify_release_tag
          # GitHub shows the tag annotation if a release has an empty body.
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes '<!-- -->'
          verify_release_tag
