name: Promote verified release
on:
  workflow_dispatch:
    inputs:
      Tag:
        description: Existing vMAJOR.MINOR.PATCH tag whose CI candidate passed acceptance
        required: true
        type: string
      CandidateRunId:
        description: Successful CI run containing the exact accepted packages
        required: true
        type: string
      EvidenceCommit:
        description: Full commit containing external Windows 11 and delivery evidence
        required: true
        type: string
      EvidencePath:
        description: Evidence JSON path within release-evidence in this repository
        required: true
        default: release-evidence/windows11.json
        type: string
      EvidenceSHA256:
        description: SHA256 of the exact external evidence JSON
        required: true
        type: string
      ResumeDraftId:
        description: Optional exact ID of this candidate's interrupted draft, with all previous checksum fields
        required: false
        type: string
      PreviousChecksumsAssetId:
        description: Exact existing SHA256SUMS asset ID authorized for replacement when resuming
        required: false
        type: string
      PreviousChecksumsSHA256:
        description: Expected original bytes of the interrupted draft's SHA256SUMS
        required: false
        type: string
      PreviousChecksumsPath:
        description: Immutable original checksum file under release-evidence in this tool commit
        required: false
        type: string
      CheckOnly:
        description: Verify candidate, layout and existing draft bytes without remote mutations
        required: false
        default: false
        type: boolean
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: release-${{ inputs.Tag }}
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      QCWS_TAG: ${{ inputs.Tag }}
      QCWS_RUN: ${{ inputs.CandidateRunId }}
      QCWS_EVIDENCE_COMMIT: ${{ inputs.EvidenceCommit }}
      QCWS_EVIDENCE_PATH: ${{ inputs.EvidencePath }}
      QCWS_EVIDENCE_SHA: ${{ inputs.EvidenceSHA256 }}
      QCWS_RESUME_DRAFT: ${{ inputs.ResumeDraftId }}
      QCWS_PREVIOUS_SUMS_ID: ${{ inputs.PreviousChecksumsAssetId }}
      QCWS_PREVIOUS_SUMS_SHA: ${{ inputs.PreviousChecksumsSHA256 }}
      QCWS_PREVIOUS_SUMS_PATH: ${{ inputs.PreviousChecksumsPath }}
      QCWS_CHECK_ONLY: ${{ inputs.CheckOnly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.Tag }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: x64
          check-latest: false
      - name: Verify original artifacts and promote only the complete release
        shell: python
        run: |
          import os,subprocess,sys
          from pathlib import Path
          subprocess.run([sys.executable,'-m','unittest','discover','-s','tools/tests',
                          '-p','test_release_transport.py'],check=True)
          command = [sys.executable,'tools/scripts/publish_verified_release.py',
            '--Tag',os.environ['QCWS_TAG'],'--CandidateRunId',os.environ['QCWS_RUN'],
            '--EvidenceCommit',os.environ['QCWS_EVIDENCE_COMMIT'],
            '--EvidencePath',os.environ['QCWS_EVIDENCE_PATH'],
            '--EvidenceSHA256',os.environ['QCWS_EVIDENCE_SHA'],
            '--ToolsCommit',os.environ['GITHUB_SHA'],
            '--CandidateSource',str(Path('candidate').resolve()),
            '--Output',str(Path(os.environ['RUNNER_TEMP'])/'qcws-publication')]
          for flag,key in [('ResumeDraftId','QCWS_RESUME_DRAFT'),
                           ('PreviousChecksumsAssetId','QCWS_PREVIOUS_SUMS_ID'),
                           ('PreviousChecksumsSHA256','QCWS_PREVIOUS_SUMS_SHA'),
                           ('PreviousChecksumsPath','QCWS_PREVIOUS_SUMS_PATH')]:
              if os.environ.get(key):
                  command += ['--'+flag,os.environ[key]]
          if os.environ.get('QCWS_CHECK_ONLY') == 'true':
              command += ['--CheckOnly']
          subprocess.run(command,check=True)
      - name: Preserve publication and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/qcws-publication/publication-result.json
            ${{ runner.temp }}/qcws-publication/publication/publication-proof.json
            ${{ runner.temp }}/qcws-publication/publication/release-manifest.json
            ${{ runner.temp }}/qcws-publication/publication/SHA256SUMS
            ${{ runner.temp }}/qcws-publication/publication/quality-evidence.zip
            ${{ runner.temp }}/qcws-publication/verified-original/release-manifest.json
            ${{ runner.temp }}/qcws-publication/verified-original/SHA256SUMS
            ${{ runner.temp }}/qcws-publication/verified-original/verified-build-provenance.json
