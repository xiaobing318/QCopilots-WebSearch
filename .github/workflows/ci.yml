name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      deep: ${{ github.event_name == 'workflow_dispatch' }}

  documentation:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Flag semicolons in documentation prose
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          files = sorted([*Path("docs").rglob("*.md"), *Path(".").glob("README*.md"), Path("CONTRIBUTING.md")])
          total = 0
          for path in files:
              fence = None
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  marker = re.match(r"^\s*(`{3,}|~{3,})", line)
                  if marker:
                      delimiter = marker.group(1)
                      if fence is None:
                          fence = delimiter
                      elif delimiter.startswith(fence):
                          fence = None
                      continue
                  if fence or not any(mark in re.sub(r"`[^`]*`", "", line) for mark in (";", "；")):
                      continue
                  print(f"::warning file={path.as_posix()},line={line_number}::Consider replacing a semicolon in prose.")
                  total += 1
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(f"Documentation lines with semicolons outside code: {total}", file=summary)
