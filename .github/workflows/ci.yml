name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      FullStability:
        description: Run five-minute cold/hot Ubuntu stability and full fuzz campaigns (Windows 11 acceptance is external)
        required: false
        type: boolean
        default: false
      LivePublicSearch:
        description: Observe 30 Chinese and 30 English queries through pinned self-hosted SearXNG
        required: false
        type: boolean
        default: false
      FuzzSeconds:
        description: Seconds per fuzzer without repeating the full stability workload
        required: false
        type: choice
        options: ['60', '300']
        default: '60'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            profile: windows-x64
          - os: ubuntu-26.04
            profile: ubuntu-x64
    env:
      QCWS_PROFILE: ${{ matrix.profile }}
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"
          architecture: x64
          check-latest: false
      - name: Prepare fixed Windows packaging tools and native Perl
        if: runner.os == 'Windows'
        run: python scripts/ci_windows_tools.py --IncludePerl
      - name: Create runner-local configuration
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root, temp = Path(os.environ['GITHUB_WORKSPACE']), Path(os.environ['RUNNER_TEMP'])
          name = os.environ['QCWS_PROFILE']
          config = json.loads((root/'config/BuildPipeline.json').read_text())
          profile = config['profiles'][name]
          profile.update(qtRoot=str(temp/'qcws-qt'),buildDir=str(root/'build/ci'),installDir=str(root/'install/ci'),cacheDir=str(temp/'qcws-cache'),proxy='',jobs=2)
          if os.name == 'nt':
              profile['tools'].update(json.loads(Path(os.environ['QCWS_WINDOWS_TOOLS']).read_text()))
          config['profiles'] = {name:profile}
          destination=temp/'qcws-build.json'
          destination.write_text(json.dumps(config),encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f: f.write(f'QCWS_CONFIG={destination}\n')
      - name: Bootstrap, build, test and install
        id: native_build
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,'scripts/pipeline.py','--ConfigPath',os.environ['QCWS_CONFIG'],'--Profile',os.environ['QCWS_PROFILE'],'--Stages','bootstrap,doctor,configure,build,test,install'],check=True)
      - name: Archive installed tree
        shell: python
        run: |
          import os, tarfile
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          source=root/'install/ci'
          if not source.is_dir(): raise RuntimeError('No installed tree')
          output=root/'work/ci-artifacts'
          output.mkdir(parents=True,exist_ok=True)
          profile=os.environ['QCWS_PROFILE']
          with tarfile.open(output/f'QCopilots-WebSearch-{profile}-ci.tar.gz','w:gz') as archive:
              archive.add(source,arcname=f'QCopilots-WebSearch-{profile}')
      - name: Build distribution candidates
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable,'scripts/pipeline.py','--ConfigPath',os.environ['QCWS_CONFIG'],'--Profile',os.environ['QCWS_PROFILE'],'--Stages','publish'],check=True)
      - name: Install acceptance tooling
        shell: python
        run: |
          import subprocess,sys
          subprocess.run([sys.executable,'-m','pip','install','--require-hashes','-r','tests/requirements.lock'],check=True)
      - name: Official SDK and stability checks
        shell: python
        env:
          QCWS_FULL_STABILITY: ${{ (inputs.FullStability || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
        run: |
          import os,subprocess,sys
          from pathlib import Path
          relative='bin/qcopilots-websearch.exe' if os.name=='nt' else 'opt/qcopilots-websearch/bin/qcopilots-websearch'
          exe=Path('install/ci',relative).resolve()
          subprocess.run([sys.executable,'scripts/test_mcp_sdk.py','--Executable',str(exe),'--Output','work/ci-artifacts/mcp-sdk.json'],check=True)
          # Windows Server keeps the smoke test. The release gate separately
          # requires five minutes per phase on Windows 11 using these exact packages.
          duration='300' if os.name!='nt' and os.environ['QCWS_FULL_STABILITY']=='true' else '10'
          subprocess.run([sys.executable,'scripts/soak.py','--Executable',str(exe),'--Seconds',duration,'--Output','work/ci-artifacts/soak.json'],check=True)
      - name: Caddy HTTPS deployment contract
        if: always() && runner.os == 'Linux' && steps.native_build.outcome == 'success'
        run: python scripts/acceptance_caddy.py --Executable install/ci/opt/qcopilots-websearch/bin/qcopilots-websearch --Output work/ci-artifacts/caddy-contract.json
      - name: DEB installation and recovery
        if: always() && runner.os == 'Linux' && steps.native_build.outcome == 'success'
        shell: python
        run: |
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          infos=list(Path('build/ci/packages').glob('*/build-info-ubuntu-x64.json'))
          if len(infos)!=1: raise RuntimeError('Expected one candidate package set')
          info=json.loads(infos[0].read_text())
          candidate=infos[0].parent/next(name for name in info['package_sha256'] if name.endswith('.deb'))
          config=json.loads(Path(os.environ['QCWS_CONFIG']).read_text())
          config['profiles'][os.environ['QCWS_PROFILE']]['cmakeArgs'].append('-DQCWS_VERSION=0.0.1')
          config['profiles'][os.environ['QCWS_PROFILE']].update(buildDir='build/baseline',installDir='install/baseline')
          baseline_config=Path(os.environ['RUNNER_TEMP'])/'qcws-baseline.json'
          baseline_config.write_text(json.dumps(config))
          subprocess.run([sys.executable,'scripts/pipeline.py','--ConfigPath',str(baseline_config),'--Profile',os.environ['QCWS_PROFILE'],'--Stages','configure,build,test,install,publish'],check=True)
          baseline_infos=list(Path('build/baseline/packages').glob('*/build-info-ubuntu-x64.json'))
          if len(baseline_infos)!=1: raise RuntimeError('Expected one baseline package set')
          baseline_info=json.loads(baseline_infos[0].read_text())
          baseline=baseline_infos[0].parent/next(name for name in baseline_info['package_sha256'] if name.endswith('.deb'))
          candidate,baseline=candidate.resolve(),baseline.resolve()
          def sha(p):
              with p.open('rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
          subprocess.run(['sudo','/usr/bin/python3','scripts/acceptance_deb.py','--Package',str(candidate),'--PackageSHA256',sha(candidate),'--BaselinePackage',str(baseline),'--BaselineSHA256',sha(baseline),'--OutputPath',str(Path('work/ci-artifacts/deb-acceptance.json').resolve()),'--DisposableMachine'],check=True)
      - name: Real public search and read/find closure
        if: always() && runner.os == 'Linux' && steps.native_build.outcome == 'success' && (inputs.LivePublicSearch || startsWith(github.ref, 'refs/tags/v'))
        run: python scripts/run_live_compose.py --Executable install/ci/opt/qcopilots-websearch/bin/qcopilots-websearch --OutputDir work/ci-artifacts
      - name: Minimal Ubuntu Python bootstrap
        if: always() && runner.os == 'Linux' && steps.native_build.outcome == 'success'
        run: bash tests/bootstrap_ubuntu.sh > work/ci-artifacts/bootstrap-ubuntu.log 2>&1
      - name: Run native quality gates
        if: always() && runner.os == 'Linux' && steps.native_build.outcome == 'success'
        env:
          QCWS_FUZZ_SECONDS: ${{ (inputs.FullStability || startsWith(github.ref, 'refs/tags/v')) && '300' || inputs.FuzzSeconds || '60' }}
        run: python scripts/quality.py --ConfigPath "$QCWS_CONFIG" --Profile "$QCWS_PROFILE" --Seconds "$QCWS_FUZZ_SECONDS" --OutputDir work/ci-artifacts/quality
      - name: Collect exact candidate distribution files
        shell: python
        run: |
          import os,shutil
          from pathlib import Path
          infos=list(Path('build/ci/packages').glob('*/build-info-*.json'))
          if len(infos)!=1: raise RuntimeError('Expected one candidate package set')
          output=Path('work/ci-artifacts/packages')
          output.mkdir()
          for source in infos[0].parent.iterdir():
              if source.is_file(): shutil.copyfile(source,output/source.name)
          import json
          evidence={key:os.environ[key] for key in ('GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_REPOSITORY')}
          evidence['profile']=os.environ['QCWS_PROFILE']
          Path('work/ci-artifacts/ci-run.json').write_text(json.dumps(evidence,indent=2)+'\n')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.profile }}
          path: work/ci-artifacts/packages/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-${{ matrix.profile }}
          path: work/ci-artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-${{ matrix.profile }}
          path: |
            build/ci/test-results.xml
            build/ci/Testing/Temporary/*.log
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
            build/ci/CMakeCache.txt
            build/ci/packages/**/CPack*.log
            work/ci-artifacts/*.json
            work/ci-artifacts/*.log
            work/ci-artifacts/quality/
          if-no-files-found: ignore
          retention-days: 14

  attest:
    name: Attest exact distribution packages
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download this run's exact distribution packages
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name packages-windows-x64 --dir work/attest/windows
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name packages-ubuntu-x64 --dir work/attest/ubuntu
          python3 - <<'PY'
          from pathlib import Path
          for folder, suffixes in (("windows", (".zip", ".msi")), ("ubuntu", (".deb",))):
              for suffix in suffixes:
                  files = list((Path("work/attest") / folder).glob("*" + suffix))
                  if len(files) != 1 or not files[0].is_file():
                      raise RuntimeError("Expected one distribution package per format")
          PY
      - name: Attest distribution package bytes
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/work/attest/windows/*.zip
            ${{ github.workspace }}/work/attest/windows/*.msi
            ${{ github.workspace }}/work/attest/ubuntu/*.deb
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
