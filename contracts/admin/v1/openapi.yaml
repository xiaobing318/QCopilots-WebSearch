{
  "openapi": "3.1.0",
  "info": {
    "title": "QCopilots-WebSearch Administration",
    "version": "1"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:3183/admin/api/v1"
    }
  ],
  "paths": {
    "/login-links": {
      "post": {
        "summary": "Issue a single-use settings link",
        "security": [
          {
            "bearer": []
          }
        ],
        "responses": {
          "200": {
            "description": "Issue a single-use settings link",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "url": {
                      "type": "string"
                    },
                    "expires_in": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        }
      }
    },
    "/session": {
      "post": {
        "summary": "Exchange a login code or admin token",
        "security": [],
        "responses": {
          "200": {
            "description": "Exchange a login code or admin token",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "csrf": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "oneOf": [
                  {
                    "required": [
                      "code"
                    ],
                    "type": "object",
                    "properties": {
                      "code": {
                        "type": "string"
                      }
                    }
                  },
                  {
                    "required": [
                      "token"
                    ],
                    "type": "object",
                    "properties": {
                      "token": {
                        "type": "string"
                      }
                    }
                  }
                ]
              }
            }
          }
        }
      },
      "get": {
        "summary": "Read the current session",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Read the current session",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "csrf": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        }
      },
      "delete": {
        "summary": "End the current session",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "End the current session"
          },
          "default": {
            "description": "Request failed"
          }
        },
        "parameters": [
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/settings": {
      "get": {
        "summary": "Read settings without secrets",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Read settings without secrets",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "settings-view.schema.json"
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        }
      },
      "put": {
        "summary": "Update settings",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Update settings",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "settings-view.schema.json"
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          },
          "409": {
            "description": "The caller's revision does not match the current settings"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "settings-update.schema.json"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/providers/{id}/key": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "searxng",
              "brave",
              "tavily",
              "exa",
              "perplexity",
              "deepseek"
            ]
          }
        }
      ],
      "put": {
        "summary": "Store a provider key",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Store a provider key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "settings-view.schema.json"
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "key": {
                    "type": "string"
                  }
                },
                "required": [
                  "key"
                ]
              }
            }
          }
        },
        "parameters": [
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      },
      "delete": {
        "summary": "Delete a provider key",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Delete a provider key",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "settings-view.schema.json"
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        },
        "parameters": [
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/providers/{id}/test": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "auto",
              "searxng",
              "brave",
              "tavily",
              "exa",
              "perplexity",
              "deepseek"
            ]
          }
        }
      ],
      "post": {
        "summary": "Test a configured source",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Test a configured source"
          },
          "default": {
            "description": "Request failed"
          }
        },
        "parameters": [
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/status": {
      "get": {
        "summary": "Read listeners, client MCP endpoint, cooldown and settings status",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Local service status. mcp_url is configured deployment metadata, not a reachability result.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "version": {
                      "type": "string"
                    },
                    "listeners": {
                      "type": "object"
                    },
                    "mcp_url": {
                      "type": "string",
                      "format": "uri",
                      "description": "Validated business.public_url when configured. Otherwise the actual local business HTTP(S) URL plus /mcp, with IPv6 brackets and the bound port. Does not change Host or Origin policy."
                    },
                    "cooldown": {
                      "type": "object"
                    },
                    "settings_error": {
                      "type": [
                        "string",
                        "null"
                      ]
                    }
                  },
                  "required": [
                    "version",
                    "listeners",
                    "mcp_url",
                    "cooldown",
                    "settings_error"
                  ]
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        }
      }
    },
    "/clients": {
      "get": {
        "summary": "Read persisted client identities and pending state",
        "security": [
          {
            "cookie": []
          }
        ],
        "responses": {
          "200": {
            "description": "Client identities and credential source types, without credentials or digests.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClientRegistryView"
                }
              }
            }
          },
          "default": {
            "description": "Request failed"
          }
        }
      },
      "post": {
        "summary": "Add a client authorization code",
        "description": "Save the registry atomically and apply all its clients before returning. Requires an administrator session and same-origin CSRF protection. Existing-client rotation retains its cache and MCP identity. Deleting and recreating an ID starts a new identity.",
        "security": [
          {
            "cookie": []
          }
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "The exact allowed administration origin."
          },
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "revision": {
                    "type": "string",
                    "minLength": 64,
                    "maxLength": 64,
                    "description": "Opaque revision of the persisted client list."
                  },
                  "id": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_.-]{1,64}$"
                  },
                  "token": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192,
                    "not": {
                      "pattern": "[^!-~]"
                    },
                    "writeOnly": true,
                    "description": "Manual business credential. Any nonempty visible ASCII value is accepted. Whitespace is rejected, not trimmed."
                  }
                },
                "required": [
                  "revision",
                  "id",
                  "token"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Client identities and credential source types, without credentials or digests.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClientRegistryView"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or duplicate client ID or credential."
          },
          "401": {
            "description": "Administration session is missing or expired."
          },
          "403": {
            "description": "Origin or CSRF token is not allowed."
          },
          "409": {
            "description": "The persisted registry changed. Reload its view and explicitly retry."
          },
          "default": {
            "description": "Request failed without applying a partial registry."
          }
        }
      },
      "put": {
        "summary": "Replace an existing client authorization code",
        "description": "Save the registry atomically and apply all its clients before returning. Requires an administrator session and same-origin CSRF protection. Existing-client rotation retains its cache and MCP identity. Deleting and recreating an ID starts a new identity. Pass the client ID in the JSON body so every valid ID, including . and .., is supported without URL path normalization.",
        "security": [
          {
            "cookie": []
          }
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "The exact allowed administration origin."
          },
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "revision": {
                    "type": "string",
                    "minLength": 64,
                    "maxLength": 64,
                    "description": "Opaque revision of the persisted client list."
                  },
                  "id": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_.-]{1,64}$"
                  },
                  "token": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 8192,
                    "not": {
                      "pattern": "[^!-~]"
                    },
                    "writeOnly": true,
                    "description": "Manual business credential. Any nonempty visible ASCII value is accepted. Whitespace is rejected, not trimmed."
                  }
                },
                "required": [
                  "revision",
                  "id",
                  "token"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Client identities and credential source types, without credentials or digests.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClientRegistryView"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or duplicate client ID or credential."
          },
          "401": {
            "description": "Administration session is missing or expired."
          },
          "403": {
            "description": "Origin or CSRF token is not allowed."
          },
          "409": {
            "description": "The persisted registry changed. Reload its view and explicitly retry."
          },
          "default": {
            "description": "Request failed without applying a partial registry."
          },
          "404": {
            "description": "Client ID was not found."
          }
        }
      },
      "delete": {
        "summary": "Delete a client authorization code",
        "description": "Save the registry atomically and apply all its clients before returning. Requires an administrator session and same-origin CSRF protection. Existing-client rotation retains its cache and MCP identity. Deleting and recreating an ID starts a new identity. Pass the client ID in the JSON body so every valid ID, including . and .., is supported without URL path normalization.",
        "security": [
          {
            "cookie": []
          }
        ],
        "parameters": [
          {
            "name": "Origin",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "The exact allowed administration origin."
          },
          {
            "name": "X-QCWS-CSRF",
            "in": "header",
            "required": true,
            "schema": {
