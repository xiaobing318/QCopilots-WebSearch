            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "revision": {
                    "type": "string",
                    "minLength": 64,
                    "maxLength": 64,
                    "description": "Opaque revision of the persisted client list."
                  },
                  "id": {
                    "type": "string",
                    "pattern": "^[A-Za-z0-9_.-]{1,64}$"
                  }
                },
                "required": [
                  "revision",
                  "id"
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Client identities and credential source types, without credentials or digests.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ClientRegistryView"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input or duplicate client ID or credential."
          },
          "401": {
            "description": "Administration session is missing or expired."
          },
          "403": {
            "description": "Origin or CSRF token is not allowed."
          },
          "409": {
            "description": "The persisted registry changed. Reload its view and explicitly retry."
          },
          "default": {
            "description": "Request failed without applying a partial registry."
