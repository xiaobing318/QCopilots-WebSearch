  "components": {
    "securitySchemes": {
      "bearer": {
        "type": "http",
        "scheme": "bearer"
      },
      "cookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "qcws_admin"
      }
    },
    "schemas": {
      "ClientRegistryView": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "string",
            "minLength": 64,
            "maxLength": 64,
            "description": "Opaque revision of the persisted client list."
          },
          "clients": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object",
              "properties": {
                "id": {
                  "type": "string",
                  "pattern": "^[A-Za-z0-9_.-]{1,64}$"
                },
                "source": {
                  "type": "string",
                  "enum": [
                    "manual",
                    "file",
                    "environment"
                  ]
                }
              },
              "required": [
                "id",
                "source"
              ],
              "additionalProperties": false
            }
          },
          "pending_restart": {
            "type": "boolean",
            "description": "Persisted clients differ from the active HTTP identity snapshot. A successful web change applies the complete current list."
          }
        },
        "required": [
          "revision",
          "clients",
          "pending_restart"
        ],
        "additionalProperties": false
      }
    }
  }
}
